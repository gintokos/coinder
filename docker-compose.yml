version: '3.8'
services:
  frontend:
    image: myapp-frontend:1.0
    networks:
      app-network:
        ipv4_address: 172.20.0.2
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: myapp-backend:1.0
    networks:
      app-network:
        ipv4_address: 172.20.0.3
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:14-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=GK986vBBdOOkjh08Bvzzz
    networks:
      app-network:
        ipv4_address: 172.20.0.4
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: myapp-nginx:1.0
    network_mode: host
    environment:
      - NGINX_HOST=coinder.website
      - DOMAINS=coinder.website
      - EMAIL=rakowqlo91fjis@gmail.com
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    extra_hosts:
      - "frontend:172.20.0.2"
      - "backend:172.20.0.3"

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local