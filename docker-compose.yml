version: '3.8'
services:
  frontend:
    image: myapp-frontend:1.0
    networks:
      app-network:
        ipv4_address: 172.20.0.2
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: myapp-backend:1.0
    networks:
      app-network:
        ipv4_address: 172.20.0.3
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    command: sh -c "
      echo 'Waiting for database to be ready...' &&
      while ! nc -z database 5432; do
        sleep 1
      done &&
      echo 'Database is ready!' &&
      echo 'Waiting for Kafka to be ready...' &&
      while ! nc -z kafka 9092; do
        sleep 1
      done &&
      echo 'Kafka is ready!' &&
      ./build/app/app --config ./appconfig.json &
      ./build/parser/parser --config ./configparser.json &
      wait
      "

  coinparser:
    image: myapp-coinparser:1.0
    networks:
      app-network:
        ipv4_address: 172.20.0.4
    depends_on:
      - backend
      - kafka
    restart: unless-stopped

  database:
    image: postgres:14-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      app-network:
        ipv4_address: 172.20.0.6
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: myapp-nginx:1.0
    network_mode: host
    environment:
      - NGINX_HOST=coinder.space
      - DOMAINS=coinder.space
      - EMAIL=asfdu8aiuafsd@gmail.com
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    extra_hosts:
      - "frontend:172.20.0.2"
      - "backend:172.20.0.3"

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  certbot-conf:
    driver: local
  certbot-www:
    driver: local
  kafka-data:
    driver: local