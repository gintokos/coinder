<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        #root:empty {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            margin: 0;
            background: #ffffff;
        }
    
        #root:empty:before {
            content: '';
            width: 70px;         
            height: 70px;       
            border: 5px solid #f3f3f3;    
            border-top: 5px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script async src="https://telegram.org/js/telegram-widget.js"></script>
    <script async src="https://telegram.org/js/telegram-web-app.js?56"></script>
    <title>Coinder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
